server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Python image service
image.service.url=http://localhost:8000

# Temp storage
app.temp.dir=${java.io.tmpdir}/mdot_studio

# Print defaults
print.default.margin.mm=5
print.default.card.width.mm=85.6
print.default.card.height.mm=54

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
